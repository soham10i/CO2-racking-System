# Quality gates for the v2 app: backend tests, frontend checks, then the full stack in Docker
# with Playwright journeys, axe (WCAG 2.1 AA, serious/critical fail) and Lighthouse budgets.
name: CI

on:
  push:
    branches: [main, v2-rebuild]
    paths: ['source_code/**', '.github/workflows/ci.yml']
  pull_request:
    paths: ['source_code/**', '.github/workflows/ci.yml']

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: source_code/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: mvn -B -q test
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: source_code/backend/target/surefire-reports

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: source_code/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: source_code/frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npx vite build

  e2e:
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: source_code
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: source_code/frontend/package-lock.json
      # Throwaway secrets for this run only; nothing is stored or reused.
      - name: Write .env
        run: |
          {
            echo "DB_PASSWORD=$(openssl rand -hex 24)"
            echo "JWT_SECRET=$(openssl rand -base64 48 | tr -d '\n')"
            echo "COOKIE_SECURE=false"
          } > .env
      - name: Start the stack
        run: docker compose up -d --build
      - name: Wait for the API
        run: |
          for i in $(seq 1 60); do
            # Any answer from Spring (even 4xx) means nginx reaches the API; 502/000 means not yet.
            code=$(curl -s -o /dev/null -w '%{http_code}' -X POST -H 'Content-Type: application/json' -d '{}' http://127.0.0.1:8081/api/v1/auth/login)
            case "$code" in 4*) exit 0 ;; esac
            sleep 3
          done
          docker compose logs api
          exit 1
      - working-directory: source_code/frontend
        run: npm ci
      - working-directory: source_code/frontend
        run: npx playwright install --with-deps chromium
      - name: Playwright journeys and axe
        working-directory: source_code/frontend
        run: npm run e2e
      - name: Lighthouse CI
        working-directory: source_code/frontend
        run: npx -y @lhci/cli@0.14.0 autorun
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-reports
          path: |
            source_code/frontend/playwright-report
            source_code/frontend/test-results
            source_code/frontend/lighthouse-report
      - if: failure()
        run: docker compose logs api web
