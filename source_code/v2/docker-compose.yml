# Local full stack: web (nginx) -> api (Spring Boot) -> postgres, with MailHog catching emails.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: co2tracker
      POSTGRES_USER: co2tracker
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U co2tracker"]
      interval: 5s
      retries: 10

  mailhog:
    image: mailhog/mailhog:v1.0.1
    ports:
      - "127.0.0.1:8025:8025"   # inbox UI: http://localhost:8025

  api:
    build: ./backend
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/co2tracker
      DB_USER: co2tracker
      DB_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env (>= 32 chars)}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}   # set true behind HTTPS
      MAIL_HOST: mailhog
      MAIL_PORT: 1025
      APP_FRONTEND_URL: ${APP_FRONTEND_URL:-http://localhost:8081}

  web:
    build: ./frontend
    depends_on:
      - api
    ports:
      - "127.0.0.1:8081:8080"   # app: http://localhost:8081

volumes:
  pgdata:
