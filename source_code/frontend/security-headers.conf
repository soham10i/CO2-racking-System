# Included in every location: nginx drops server-level add_header lines in any location that adds its own.
add_header X-Content-Type-Options "nosniff" always;
# Google sign-in checks the page origin, so cross-origin requests carry the origin (never the path).
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header X-Frame-Options "DENY" always;
add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=(), usb=()" always;
# Lets the Google sign-in popup report back to this page; everything else stays isolated.
add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;
add_header Cross-Origin-Resource-Policy "same-origin" always;
# Ignored by browsers over plain http; takes effect once the site is served over HTTPS.
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://accounts.google.com/gsi/client; style-src 'self' https://accounts.google.com/gsi/style; frame-src https://accounts.google.com/gsi/; connect-src 'self' https://accounts.google.com/gsi/; img-src 'self' data: https://*.googleusercontent.com; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
