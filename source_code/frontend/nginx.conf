# Per-client-IP request budgets. Sign-in style endpoints get a tight one (password guessing, sign-up
# spam, reset-mail floods); the rest of the API a generous one. Over budget answers 429.
limit_req_zone $binary_remote_addr zone=auth:10m rate=30r/m;
limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;
limit_req_status 429;

server {
  listen 8080;
  root /usr/share/nginx/html;
  index index.html;
  server_tokens off;
  # In production Caddy terminates TLS in front of us: take the client address from its X-Forwarded-For,
  # trusting only private (container network) hops, so rate limits count per visitor and not per proxy.
  set_real_ip_from 10.0.0.0/8;
  set_real_ip_from 172.16.0.0/12;
  set_real_ip_from 192.168.0.0/16;
  real_ip_header X-Forwarded-For;
  real_ip_recursive on;
  include /etc/nginx/security-headers.conf;

  location ~ ^/api/v1/auth/(login|register|google|forgot-password|reset-password)$ {
    limit_req zone=auth burst=40 nodelay;
    include /etc/nginx/security-headers.conf;
    proxy_pass http://api:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    client_max_body_size 16k;
  }

  location /api/ {
    limit_req zone=api burst=60 nodelay;
    include /etc/nginx/security-headers.conf;
    proxy_pass http://api:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    client_max_body_size 2m;
  }

  # Only the health probe of the actuator is reachable from outside, and only through the API itself.
  location /actuator/ {
    return 404;
  }

  location /assets/ {
    include /etc/nginx/security-headers.conf;
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  location / {
    include /etc/nginx/security-headers.conf;
    add_header Cache-Control "no-cache";
    try_files $uri /index.html;
  }
}
