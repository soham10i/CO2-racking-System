# Local full stack: web (nginx) -> api (Spring Boot) -> postgres, with MailHog catching emails.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: co2tracker
      POSTGRES_USER: co2tracker
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U co2tracker"]
      interval: 5s
      retries: 10

  mailhog:
    image: mailhog/mailhog:v1.0.1
    ports:
      - "127.0.0.1:8025:8025"   # inbox UI: http://localhost:8025

  api:
    build: ./backend
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # Supabase Postgres when SUPABASE_DB_URL is set in .env, otherwise the local postgres container.
      DB_URL: ${SUPABASE_DB_URL:-jdbc:postgresql://postgres:5432/co2tracker}
      DB_USER: ${SUPABASE_DB_USER:-co2tracker}
      DB_PASSWORD: ${SUPABASE_DB_PASSWORD:-${DB_PASSWORD}}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env (>= 32 chars)}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}   # set true behind HTTPS
      MAIL_HOST: mailhog
      MAIL_PORT: 1025
      APP_FRONTEND_URL: ${APP_FRONTEND_URL:-http://localhost:8081}
      APP_ADMIN_EMAILS: ${APP_ADMIN_EMAILS:-}   # comma-separated; these accounts get the admin factor console
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}   # empty = no "Continue with Google" button
      API_DOCS_ENABLED: ${API_DOCS_ENABLED:-false}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}   # web push stays off while the keys are empty
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-mailto:admin@co2tracker.local}
      NEXUS_URL: http://hermes:8642        # Nexus assistant; the browser only ever talks to the api
      NEXUS_API_KEY: ${HERMES_API_KEY:?set HERMES_API_KEY in .env (openssl rand -hex 32)}

  # Hermes agent behind Nexus. No published port: only the api container can reach it.
  hermes:
    build:
      context: ./hermes-agent
      dockerfile: docker/Dockerfile
    environment:
      API_SERVER_KEY: ${HERMES_API_KEY:?set HERMES_API_KEY in .env}
      # Empty MERCURY_API_KEY = local mock below; set both lines in .env for the real Mercury API.
      MERCURY_API_KEY: ${MERCURY_API_KEY:-mock-key}
      MERCURY_BASE_URL: ${MERCURY_BASE_URL:-http://mock-mercury:8000/v1}
      MERCURY_MODEL: ${MERCURY_MODEL:-mercury-2}
      PORT: "8642"
    volumes:
      - ./hermes-agent/config/nexus.yaml:/opt/hermes-defaults/config.yaml:ro   # chat only: no tools, no memory
    read_only: true
    tmpfs:
      - /tmp
      - /opt/data:uid=10001,gid=10001,mode=0700
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    depends_on:
      - mock-mercury

  mock-mercury:
    image: python:3.13-slim-trixie
    command: ["python", "/app/mock_mercury.py"]
    volumes:
      - ./hermes-agent/mock:/app:ro
    environment:
      MOCK_EXPECTED_KEY: mock-key

  web:
    build: ./frontend
    depends_on:
      - api
    ports:
      - "127.0.0.1:8081:8080"   # app: http://localhost:8081

volumes:
  pgdata:
