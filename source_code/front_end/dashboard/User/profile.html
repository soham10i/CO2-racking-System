<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Profile</title>
    <link rel="stylesheet" href="profile.css">
    <link rel="stylesheet" href="../../login/popupstyle.css">
</head>
<body>
<div class="profile-container">
    <h1>User Profile</h1>
    <form id="userProfileForm">
        <div class="form-group">
            <label for="firstName">First Name</label>
            <input type="text" id="firstName" name="firstName" readonly>
        </div>
        <div class="form-group">
            <label for="lastName">Last Name</label>
            <input type="text" id="lastName" name="lastName" readonly>
        </div>
        <div class="form-group">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" readonly>
        </div>
        <div class="form-group">
            <label for="address">Address</label>
            <input type="text" id="address" name="address" readonly>
        </div>
        <div class="form-group">
            <label for="phoneNumber">Phone Number</label>
            <input type="text" id="phoneNumber" name="phoneNumber" readonly>
        </div>
        <div class="form-group">
            <label for="role">Role</label>
            <input type="text" id="role" name="role" readonly>
        </div>
        <div class="form-group">
            <button type="button" id="updateButton" class="primary-btn">Update</button>
            <button type="button" id="cancelButton" class="secondary-btn" style="display: none;">Cancel</button>
        </div>
    </form>
</div>

<!-- Custom Popup -->
<div id="messagePopup" class="popup">
    <div class="popup-content">
        <span class="close-btn">&times;</span>
        <h2 id="popupTitle"></h2>
        <p id="popupMessage"></p>
    </div>
</div>

<script>
    document.addEventListener('DOMContentLoaded', async function() {
        const authToken = localStorage.getItem('authToken');

        async function fetchUserProfile() {
            try {
                // Fetch user profile details
                const response = await fetch('http://localhost:6060/user/get-profile', {
                    method: 'GET',
                    headers: {
                        'Authorization': `Bearer ${authToken}`,
                        'Content-Type': 'application/json'
                    }
                });

                if (response.ok) {
                    const data = await response.json();
                    document.getElementById('firstName').value = data.firstName;
                    document.getElementById('lastName').value = data.lastName;
                    document.getElementById('email').value = data.email;
                    document.getElementById('address').value = data.address;
                    document.getElementById('phoneNumber').value = `+49 ${data.phoneNumber}`;
                    document.getElementById('role').value = data.role;
                } else {
                    const errorData = await response.json();
                    alert(errorData.message || 'An error occurred. Please try again later.');
                }
            } catch (error) {
                console.error('Error:', error);
                alert('An error occurred. Please try again later.');
            }
        }

        await fetchUserProfile();

        document.getElementById('updateButton').addEventListener('click', function() {
            const inputs = document.querySelectorAll('#userProfileForm input');
            inputs.forEach(input => {
                if (input.id !== 'email' && input.id !== 'role') {
                    input.removeAttribute('readonly');
                }
            });
            this.textContent = 'Save';
            this.id = 'saveButton';
            document.getElementById('cancelButton').style.display = 'inline-block';

            // Add event listener to the new save button
            document.getElementById('saveButton').addEventListener('click', async function() {
                // Collect form data
                const firstName = document.getElementById('firstName').value.trim();
                const lastName = document.getElementById('lastName').value.trim();
                const address = document.getElementById('address').value.trim();
                const phoneNumber = document.getElementById('phoneNumber').value.replace('+49 ', '').trim();
                const role = document.getElementById('role').value.trim();

                // Prepare the request body
                const requestBody = {
                    firstName: firstName,
                    lastName: lastName,
                    address: address,
                    phoneNumber: phoneNumber,
                    role: role
                };

                try {
                    // Send POST request to the update profile API
                    const response = await fetch('http://localhost:6060/user/update-profile', {
                        method: 'POST',
                        headers: {
                            'Authorization': `Bearer ${authToken}`,
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify(requestBody)
                    });

                    if (response.ok) {
                        const data = await response.text();
                        showMessagePopup('Success', data);
                        setTimeout(() => {
                            window.location.reload();
                        }, 2000);
                    } else {
                        const errorData = await response.json();
                        showMessagePopup('Error', errorData.message || 'An error occurred. Please try again later.');
                    }
                } catch (error) {
                    console.error('Error:', error);
                    showMessagePopup('Error', 'An error occurred. Please try again later.');
                }
            });
        });

        document.getElementById('cancelButton').addEventListener('click', async function() {
            await fetchUserProfile();
            const inputs = document.querySelectorAll('#userProfileForm input');
            inputs.forEach(input => {
                input.setAttribute('readonly', true);
            });
            document.getElementById('saveButton').textContent = 'Update';
            document.getElementById('saveButton').id = 'updateButton';
            this.style.display = 'none';
        });

        function showMessagePopup(title, message) {
            document.getElementById('popupTitle').textContent = title;
            document.getElementById('popupMessage').textContent = message;
            document.getElementById('messagePopup').style.display = 'block';
        }

        // Close popup when the close button is clicked
        document.querySelector('.close-btn').addEventListener('click', function() {
            document.getElementById('messagePopup').style.display = 'none';
        });
    });
</script>
</body>
</html>
