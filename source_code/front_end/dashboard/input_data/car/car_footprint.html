<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Car Footprint</title>
    <link rel="stylesheet" href="car_style.css">
    <style>
        body {
            font-family: 'Arial', sans-serif;
        }
        .edit-btn, .delete-btn {
            background-color: #003366;
            color: white;
            padding: 5px 10px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
            margin: 2px;
        }
        .edit-btn:hover {
            background-color: #002d4d;
        }
        .delete-btn {
            background-color: #cc0000;
        }
        .delete-btn:hover {
            background-color: #990000;
        }
        .data-table th:nth-child(7), .data-table td:nth-child(7) {
            width: 200px; /* Increase width of Created At column */
        }
        .data-table th:nth-child(8), .data-table td:nth-child(8) {
            width: 150px; /* Increase width of Actions column */
        }
        .container {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: stretch; /* Ensure both sections stretch to the same height */
        }
        .input-category {
            flex: 1;
            min-width: 300px;
            max-width: 400px;
            margin-right: 20px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            height: 100%; /* Ensure it takes full height */
        }
        .data-table {
            flex: 2;
            min-width: 600px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            height: 100%; /* Ensure it takes full height */
        }
    </style>
</head>
<body>
<div class="container">
    <div class="input-category">
        <h2>Car Carbon Footprint</h2>
        <form id="car-form">
            <!-- ...existing code from car.html... -->
            <label for="mileage">Mileage (km)</label>
            <input type="number" id="mileage" name="mileage" placeholder="Enter mileage in km" required>

            <label for="car-model">Choose Vehicle</label>
            <input type="text" id="car-model" name="car_model" placeholder="Enter vehicle model (e.g., Toyota Prius)" required>

            <label for="year">Year</label>
            <input type="number" id="year" name="year" placeholder="Enter manufacturing year" required>

            <label for="fuel-efficiency">Fuel Efficiency (g/km)</label>
            <input type="number" id="fuel-efficiency" name="fuel_efficiency" placeholder="Enter fuel efficiency in g/km" required>

            <button type="submit" class="submit-btn" id="submit-btn">Submit</button>
        </form>
        <div class="response-message" id="response-message"></div>
    </div>

    <!-- Table to display car CO2 footprint data -->
    <div class="data-table">
        <h2>Car CO2 Footprint Data</h2>
        <table id="carDataTable">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Car Model</th>
                    <th>Year</th>
                    <th>Mileage (km)</th>
                    <th>Efficiency (g/km)</th>
                    <th>CO2 Emission (metric tons)</th>
                    <th>Created At</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody>
                <!-- Data will be populated here by JavaScript -->
            </tbody>
        </table>
        <div class="pagination">
            <button id="prevPage" disabled>Previous</button>
            <span id="pageInfo"></span>
            <button id="nextPage">Next</button>
        </div>
    </div>
</div>

<!-- Popup for displaying CO2 value -->
<div id="co2Popup" class="popup">
    <div class="popup-content">
        <h2>Calculated CO2 Footprint</h2>
        <p id="popupMessage"></p>
        <button class="ok-btn" id="okButton">OK</button>
    </div>
</div>

<script>
    let currentPage = 1;
    const recordsPerPage = 10;
    let editingId = null;

    document.getElementById("car-form").addEventListener("submit", async function (event) {
        event.preventDefault();

        // Logged-in user email (fetch from session/JWT or hardcoded for testing)
        const userEmail = localStorage.getItem("email");
        const authToken = localStorage.getItem("authToken"); // Fetch auth token from localStorage

        // Collect form data
        const mileage = document.getElementById("mileage").value;
        const carModel = document.getElementById("car-model").value;
        const year = document.getElementById("year").value;
        const efficiency = document.getElementById("fuel-efficiency").value;

        // Build request payload
        const requestBody = {
            email: userEmail,
            transportType: "Car",
            mileage: parseFloat(mileage),
            carModel: carModel,
            year: parseInt(year),
            efficiency: parseFloat(efficiency)
        };

        const url = editingId ? `http://localhost:6060/calculator/transportation/update/car/${editingId}` : "http://localhost:6060/calculator/transportation/calculate";
        const method = "POST";

        // Disable the submit button and show loading text
        const submitButton = document.getElementById("submit-btn");
        submitButton.disabled = true;
        submitButton.textContent = editingId ? "Updating..." : "Submitting...";

        // Send data to the backend
        try {
            const response = await fetch(url, {
                method: method,
                headers: {
                    "Content-Type": "application/json",
                    "Authorization": `Bearer ${authToken}` // Add auth token to headers
                },
                body: JSON.stringify(requestBody)
            });

            const responseData = await response.text(); // Response as plain text

            // Handle response
            if (response.ok) {
                document.getElementById("popupMessage").textContent = responseData;
                document.getElementById("co2Popup").style.display = 'block';
                loadCarData(); // Reload car data after submission
                resetForm();
            } else {
                document.getElementById("response-message").textContent = `Error: ${responseData}`;
                document.getElementById("response-message").classList.add("error-message");
            }
        } catch (error) {
            // Handle fetch errors
            document.getElementById("response-message").textContent = `Error: ${error.message}`;
            document.getElementById("response-message").classList.add("error-message");
        } finally {
            // Re-enable the submit button and reset text
            submitButton.disabled = false;
            submitButton.textContent = editingId ? "Update" : "Submit";
        }
    });

    // Close popup and reset form when OK button is clicked
    document.getElementById("okButton").addEventListener("click", function() {
        document.getElementById("co2Popup").style.display = 'none';
        resetForm();
    });

    function resetForm() {
        document.getElementById("car-form").reset();
        document.getElementById("response-message").textContent = '';
        document.getElementById("submit-btn").textContent = "Submit";
        editingId = null;
    }

    // Function to load car data
    async function loadCarData() {
        const userId = localStorage.getItem("userId"); // Fetch userId from localStorage

        if (!userId) {
            console.error("User ID not found in localStorage.");
            document.getElementById("response-message").textContent = "User ID not found. Please log in.";
            document.getElementById("response-message").classList.add("error-message");
            return;
        }

        try {
            const response = await fetch(`http://localhost:6060/calculator/transportation/car/user/${userId}`, {
                headers: {
                    "Authorization": `Bearer ${localStorage.getItem("authToken")}` // Add auth token to headers
                }
            });
            const carData = await response.json();

            // Sort data from recent to older
            carData.sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt));

            const totalPages = Math.ceil(carData.length / recordsPerPage);
            const start = (currentPage - 1) * recordsPerPage;
            const end = start + recordsPerPage;
            const paginatedData = carData.slice(start, end);

            const tableBody = document.getElementById("carDataTable").querySelector("tbody");
            tableBody.innerHTML = ""; // Clear existing data

            paginatedData.forEach(record => {
                const row = document.createElement("tr");
                row.innerHTML = `
                    <td>${record.id}</td>
                    <td>${record.carModel}</td>
                    <td>${record.year}</td>
                    <td>${record.mileage}</td>
                    <td>${record.efficiency}</td>
                    <td>${record.co2EmissionMetricTons}</td>
                    <td>${new Date(record.createdAt).toLocaleString('en-GB', { day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit' })}</td>
                    <td>
                        <button class="edit-btn" onclick="editRecord(${record.id})">Edit</button>
                        <button class="delete-btn" onclick="deleteRecord(${record.id})">Delete</button>
                    </td>
                `;
                tableBody.appendChild(row);
            });

            document.getElementById("pageInfo").textContent = `Page ${currentPage} of ${totalPages}`;
            document.getElementById("prevPage").disabled = currentPage === 1;
            document.getElementById("nextPage").disabled = currentPage === totalPages;
        } catch (error) {
            console.error("Error loading car data:", error);
        }
    }

    document.getElementById("prevPage").addEventListener("click", function() {
        if (currentPage > 1) {
            currentPage--;
            loadCarData();
        }
    });

    document.getElementById("nextPage").addEventListener("click", function() {
        currentPage++;
        loadCarData();
    });

    // Function to edit a record
    async function editRecord(id) {
        // Redirect to car.html with the record ID as a query parameter
        window.location.href = `car.html?id=${id}&edit=true`;
    }

    // Function to delete a record
    async function deleteRecord(id) {
        if (confirm("Are you sure you want to delete this record?")) {
            try {
                const response = await fetch(`http://localhost:6060/calculator/transportation/car/delete/${id}`, {
                    method: "DELETE",
                    headers: {
                        "Authorization": `Bearer ${localStorage.getItem("authToken")}` // Add auth token to headers
                    }
                });

                if (response.ok) {
                    loadCarData(); // Reload car data after deletion
                } else {
                    console.error("Error deleting record:", await response.text());
                }
            } catch (error) {
                console.error("Error deleting record:", error);
            }
        }
    }

    // Load car data on page load
    window.onload = loadCarData;
</script>
</body>
</html>
