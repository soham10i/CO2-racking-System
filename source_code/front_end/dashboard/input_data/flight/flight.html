<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flight Footprint</title>
    <link rel="stylesheet" href="../form_style.css">
    <style>
        .input-category {
            max-width: 500px;
            margin: 0 auto;
            padding: 20px;
            background-color: #fff;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        .input-category h2 {
            text-align: center;
            margin-bottom: 20px;
            color: #003366;
        }

        .input-category label {
            display: block;
            margin-bottom: 10px;
            font-size: 16px;
            color: #555;
        }

        .input-category input,
        .input-category select {
            width: 100%;
            padding: 10px;
            margin-bottom: 20px;
            border: 1px solid #ddd;
            border-radius: 5px;
            box-sizing: border-box;
        }

        .submit-btn {
            display: block;
            width: 100%;
            background-color: #003366;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 18px;
            text-align: center;
        }

        .submit-btn:hover {
            background-color: #002d4d;
        }
    </style>
</head>
<body>
<div class="input-category">
    <h2>Flight Carbon Footprint</h2>
    <form id="flight-form">
        <label for="from-location">From Location</label>
        <input type="text" id="from-location" name="from_location" placeholder="Enter from location" required>

        <label for="to-location">To Location</label>
        <input type="text" id="to-location" name="to_location" placeholder="Enter to location" required>

        <label for="via-locations">Via Locations</label>
        <input type="text" id="via-locations" name="via_locations" placeholder="Enter via locations (comma separated)">

        <label for="flight-class">Flight Class</label>
        <select id="flight-class" name="flight_class" required>
            <option value="economy">Economy</option>
            <option value="business">Business</option>
            <option value="first">First</option>
        </select>

        <label for="round-trip">Round Trip</label>
        <input type="checkbox" id="round-trip" name="round_trip">

        <label for="include-radiative-forcing">Include Radiative Forcing</label>
        <input type="checkbox" id="include-radiative-forcing" name="include_radiative_forcing">

        <label for="distance-km">Distance (km)</label>
        <input type="number" id="distance-km" name="distance_km" placeholder="Enter distance in km" required>

        <button type="submit" class="submit-btn" id="submit-btn">Submit</button>
    </form>
    <div class="response-message" id="response-message"></div>
</div>

<script>
    document.addEventListener("DOMContentLoaded", function() {
        const urlParams = new URLSearchParams(window.location.search);
        const id = urlParams.get("id");
        const isEdit = urlParams.get("edit") === "true";

        if (isEdit && id) {
            loadRecordForEditing(id);
        }

        document.getElementById("flight-form").addEventListener("submit", async function (event) {
            event.preventDefault();

            // Logged-in user email (fetch from session/JWT or hardcoded for testing)
            const userEmail = localStorage.getItem("email");

            // Collect form data
            const fromLocation = document.getElementById("from-location").value;
            const toLocation = document.getElementById("to-location").value;
            const viaLocations = document.getElementById("via-locations").value;
            const flightClass = document.getElementById("flight-class").value;
            const roundTrip = document.getElementById("round-trip").checked;
            const includeRadiativeForcing = document.getElementById("include-radiative-forcing").checked;
            const distanceKm = document.getElementById("distance-km").value;

            // Build request payload
            const requestBody = {
                email: userEmail,
                transportType: "Flight",
                fromLocation: fromLocation,
                toLocation: toLocation,
                viaLocations: viaLocations,
                flightClass: flightClass,
                roundTrip: roundTrip,
                includeRadiativeForcing: includeRadiativeForcing,
                distanceKm: parseFloat(distanceKm)
            };

            const url = isEdit ? `http://localhost:6060/calculator/transportation/update/flight/${id}` : "http://localhost:6060/calculator/transportation/calculate";
            const method = "POST";

            // Disable the submit button and show loading text
            const submitButton = document.getElementById("submit-btn");
            submitButton.disabled = true;
            submitButton.textContent = isEdit ? "Updating..." : "Submitting...";

            // Send data to the backend
            try {
                const response = await fetch(url, {
                    method: method,
                    headers: {
                        "Content-Type": "application/json",
                        "Authorization": `Bearer ${localStorage.getItem("authToken")}` // Add auth token to headers
                    },
                    body: JSON.stringify(requestBody)
                });

                const responseData = await response.text(); // Response as plain text

                // Handle response
                if (response.ok) {
                    document.getElementById("popupMessage").textContent = responseData;
                    document.getElementById("co2Popup").style.display = 'block';
                    resetForm();
                } else {
                    document.getElementById("response-message").textContent = `Error: ${responseData}`;
                    document.getElementById("response-message").classList.add("error-message");
                }
            } catch (error) {
                // Handle fetch errors
                document.getElementById("response-message").textContent = `Error: ${error.message}`;
                document.getElementById("response-message").classList.add("error-message");
            } finally {
                // Re-enable the submit button and reset text
                submitButton.disabled = false;
                submitButton.textContent = isEdit ? "Update" : "Submit";
            }
        });

        async function loadRecordForEditing(id) {
            try {
                const response = await fetch(`http://localhost:6060/calculator/transportation/flight/${id}`, {
                    headers: {
                        "Authorization": `Bearer ${localStorage.getItem("authToken")}` // Add auth token to headers
                    }
                });
                const record = await response.json();

                // Load data into the form
                document.getElementById("from-location").value = record.fromLocation;
                document.getElementById("to-location").value = record.toLocation;
                document.getElementById("via-locations").value = record.viaLocations;
                document.getElementById("flight-class").value = record.flightClass;
                document.getElementById("round-trip").checked = record.roundTrip;
                document.getElementById("include-radiative-forcing").checked = record.includeRadiativeForcing;
                document.getElementById("distance-km").value = record.distanceKm;

                // Update button text
                document.getElementById("submit-btn").textContent = "Update";
            } catch (error) {
                console.error("Error loading record for editing:", error);
            }
        }
    });
</script>
</body>
</html>
