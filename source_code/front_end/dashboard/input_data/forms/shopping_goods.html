<div class="input-category">
    <link rel="stylesheet" type="text/css" href="../form_style.css">
    <h2>Shopping and Goods</h2>
    <form id="shopping-goods-form">
        <label for="date-time">Date and Time</label>
        <input type="datetime-local" id="date-time" name="date_time" required>

        <label for="clothing-purchases">Clothing Purchases (kg or $)</label>
        <input type="number" id="clothing-purchases" name="clothing_purchases" placeholder="Enter value">

        <label for="electronics-purchases">Electronics Purchases (kg or $)</label>
        <input type="number" id="electronics-purchases" name="electronics_purchases" placeholder="Enter value">

        <button type="submit" class="submit-btn">Submit</button>
    </form>
</div>
