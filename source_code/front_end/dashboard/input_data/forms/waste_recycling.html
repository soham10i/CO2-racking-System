<div class="input-category">
    <link rel="stylesheet" type="text/css" href="../form_style.css">
    <h2>Waste and Recycling</h2>
    <form id="waste-recycling-form">
        <label for="date-time">Date and Time</label>
        <input type="datetime-local" id="date-time" name="date_time" required>

        <label for="landfilled-waste">Landfilled Waste (kg)</label>
        <input type="number" id="landfilled-waste" name="landfilled_waste" placeholder="Enter value">

        <label for="recycled-waste">Recycled Waste (kg)</label>
        <input type="number" id="recycled-waste" name="recycled_waste" placeholder="Enter value">

        <button type="submit" class="submit-btn">Submit</button>
    </form>
</div>
