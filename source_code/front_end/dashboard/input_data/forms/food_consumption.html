<div class="input-category">
    <link rel="stylesheet" type="text/css" href="../form_style.css">
    <h2>Food Consumption</h2>
    <form id="food-consumption-form">
        <label for="date-time">Date and Time</label>
        <input type="datetime-local" id="date-time" name="date_time" required>

        <label for="meat-consumption">Meat Consumption (kg)</label>
        <input type="number" id="meat-consumption" name="meat_consumption" placeholder="Enter value">

        <label for="dairy-consumption">Dairy Products (kg)</label>
        <input type="number" id="dairy-consumption" name="dairy_consumption" placeholder="Enter value">

        <label for="plant-food-consumption">Plant-Based Foods (kg)</label>
        <input type="number" id="plant-food-consumption" name="plant_food_consumption" placeholder="Enter value">

        <button type="submit" class="submit-btn">Submit</button>
    </form>
</div>
