<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home - Carbon Footprint Tracker</title>
    <link rel="stylesheet" href="home.css">
</head>
<body>
    <div class="container">
        <h1 class="heading">User CO2 Emission Logs</h1>
        <div id="userLogsContainer" class="tiles-container">
            <!-- User logs will be populated here by JavaScript -->
        </div>
    </div>

    <script>
        // Function to load user CO2 emission logs
        async function loadUserLogs() {
            const userId = localStorage.getItem("userId"); // Fetch userId from localStorage

            if (!userId) {
                console.error("User ID not found in localStorage.");
                return;
            }

            try {
                const response = await fetch(`http://localhost:6060/calculator/transportation/user/data?userId=${userId}`, {
                    headers: {
                        "Authorization": `Bearer ${localStorage.getItem("authToken")}` // Add auth token to headers
                    }
                });
                const userLogs = await response.json();

                const logsContainer = document.getElementById("userLogsContainer");
                logsContainer.innerHTML = ""; // Clear existing logs

                userLogs.forEach(log => {
                    const logTile = document.createElement("div");
                    logTile.className = "tile";
                    logTile.innerHTML = `
                        <h2>${log.transportType} Footprint</h2>
                        <p>From: ${log.fromLocation}</p>
                        <p>To: ${log.toLocation}</p>
                        <p>CO2 Emission: ${log.co2EmissionMetricTons} metric tons</p>
                        <p>Date: ${new Date(log.createdAt).toLocaleString('en-GB', { day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit' })}</p>
                    `;
                    logsContainer.appendChild(logTile);
                });
            } catch (error) {
                console.error("Error loading user logs:", error);
            }
        }

        // Load user logs on page load
        window.onload = loadUserLogs;
    </script>
</body>
</html>
