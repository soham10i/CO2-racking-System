<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register</title>
    <link rel="stylesheet" href="registerstyle.css">
</head>
<body>
<div class="main-container">
    <div class="form-wrapper">
        <h1>Create an Account</h1>
        <form id="registrationForm">
            <!-- <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" placeholder="Enter your username" required>
            </div> -->
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" placeholder="Enter your email" required>
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" placeholder="Enter your password" required minlength="8">
            </div>
            <div class="form-group">
                <label for="confirmPassword">Confirm Password</label>
                <input type="password" id="confirmPassword" name="confirmPassword" placeholder="Confirm your password" required minlength="8">
            </div>
            <div class="form-group">
                <label for="firstName">First Name</label>
                <input type="text" id="firstName" name="firstName" placeholder="Enter your first name" required>
            </div>
            <div class="form-group">
                <label for="lastName">Last Name</label>
                <input type="text" id="lastName" name="lastName" placeholder="Enter your last name" required>
            </div>
            <style>
                .phone-input {
                    display: flex;
                    align-items: center;
                }

                .phone-input span {
                    background-color: #f0f0f0;
                    border: 1px solid #ccc;
                    border-right: none;
                    padding: 10px;
                    font-size: 14px;
                    color: #555;
                }

                .phone-input input {
                    flex: 1;
                    padding: 10px;
                    border: 1px solid #ccc;
                    border-left: none;
                    font-size: 14px;
                }

                .form-group input[type="text"],
                .form-group input[type="email"],
                .form-group input[type="password"],
                .form-group input[type="tel"] {
                    width: 100%;
                    padding: 10px;
                    border: 1px solid #ccc;
                    border-radius: 4px;
                    box-sizing: border-box;
                    font-size: 14px;
                }
            </style>
            <div class="form-group">
                <label for="phoneNumber">Phone Number</label>
                <div class="phone-input">
                    <span>+49</span>
                    <input type="tel" id="phoneNumber" name="phoneNumber" placeholder="XXXXXXXXXXX" pattern="^\d{10,14}$" oninput="this.value = this.value.replace(/[^0-9]/g, '')" required>
                </div>
            </div>
            <div class="form-group">
                <label for="address">Address</label>
                <input type="text" id="address" name="address" placeholder="Enter your address" required>
            </div>

            <button type="submit" class="primary-btn">Register</button>
        </form>
        <div class="alternate-action">
            <p>Already have an account? <a href="../login/login.html">Log in</a></p>
        </div>
    </div>
</div>
<script>
    document.getElementById('registrationForm').addEventListener('submit', async function(event) {
        event.preventDefault(); // Prevent the default form submission

        // Collect form data
        const email = document.getElementById('email').value.trim();
        const password = document.getElementById('password').value;
        const confirmPassword = document.getElementById('confirmPassword').value;

        // Validate password length
        if (password.length < 8 || confirmPassword.length < 8) {
            alert('Password must be at least 8 characters long.');
            return;
        }

        if (password !== confirmPassword) {
            alert('Passwords do not match. Please try again.');
            return;
        }

        // Prepare the request body
        const requestBody = {
            email: email,
            password: password
        };

        try {
            // Send POST request to the registration API
            const response = await fetch('http://localhost:6060/auth/signup', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(requestBody)
            });

            if (response.ok) {
                alert('Registration successful! Please login.');
                window.location.href = '../login/login.html';
            } else {
                const errorData = await response.json();
                alert(errorData.message || 'An error occurred. Please try again later.');
            }
        } catch (error) {
            console.error('Error:', error);
            alert('An error occurred. Please try again later.');
        }
    });
</script>
</body>
</html>
