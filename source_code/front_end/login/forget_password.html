<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forget Password</title>
    <link rel="stylesheet" href="loginstyle.css">
    <link rel="stylesheet" href="popupstyle.css">
</head>
<body>
<div class="main-container">
    <div class="form-wrapper">
        <h1>Forget Password</h1>
        <form id="forgetPasswordForm">
            <div class="form-group">
                <input type="email" id="email" name="email" placeholder="Enter your email" required>
            </div>
            <button type="submit" class="primary-btn">Submit</button>
        </form>
        <div class="alternate-action">
            <p>Remembered your password? <a href="../login/login.html">Login</a></p>
        </div>
    </div>
</div>

<!-- Custom Popup -->
<div id="messagePopup" class="popup">
    <div class="popup-content">
        <span class="close-btn">&times;</span>
        <h2 id="popupTitle"></h2>
        <p id="popupMessage"></p>
    </div>
</div>

<script>
    document.getElementById('forgetPasswordForm').addEventListener('submit', async function(event) {
        event.preventDefault(); // Prevent the default form submission

        // Collect form data
        const email = document.getElementById('email').value.trim();

        // Validate email format
        const emailPattern = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
        if (!emailPattern.test(email)) {
            showMessagePopup('Invalid Email', 'Please enter a valid email address.');
            return;
        }

        try {
            // Send POST request to the forgot-password API
            const response = await fetch('http://localhost:6060/auth/forgot-password', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ email: email })
            });

            if (response.ok) {
                showMessagePopup('Success', 'Reset-password link has been sent to your email successfully.');
                setTimeout(() => {
                    window.location.href = '../login/reset_password.html';
                }, 2000);
            } else {
                const errorData = await response.json();
                showMessagePopup('Error', errorData.message || 'An error occurred. Please try again later.');
            }
        } catch (error) {
            console.error('Error:', error);
            showMessagePopup('Error', 'An error occurred. Please try again later.');
        }
    });

    function showMessagePopup(title, message) {
        document.getElementById('popupTitle').textContent = title;
        document.getElementById('popupMessage').textContent = message;
        document.getElementById('messagePopup').style.display = 'block';
    }

    // Close popup when the close button is clicked
    document.querySelector('.close-btn').addEventListener('click', function() {
        document.getElementById('messagePopup').style.display = 'none';
    });
</script>
</body>
</html>
