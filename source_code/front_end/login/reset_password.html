<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password</title>
    <link rel="stylesheet" href="loginstyle.css">
    <link rel="stylesheet" href="popupstyle.css">
</head>
<body>
<div class="main-container">
    <div class="form-wrapper">
        <h1>Reset Password</h1>
        <form id="resetPasswordForm">
            <div class="form-group">
                <input type="password" id="new-password" name="new_password" placeholder="Enter new password" required minlength="8">
            </div>
            <div class="form-group">
                <input type="password" id="confirm-password" name="confirm_password" placeholder="Confirm new password" required minlength="8">
            </div>
            <button type="submit" class="primary-btn">Reset Password</button>
        </form>
        <div class="alternate-action">
            <p>Remembered your password? <a href="../login/login.html">Login</a></p>
        </div>
    </div>
</div>

<!-- Custom Popup -->
<div id="messagePopup" class="popup">
    <div class="popup-content">
        <span class="close-btn">&times;</span>
        <h2 id="popupTitle"></h2>
        <p id="popupMessage"></p>
    </div>
</div>

<script>
    document.getElementById('resetPasswordForm').addEventListener('submit', async function(event) {
        event.preventDefault(); // Prevent the default form submission

        // Collect form data
        const newPassword = document.getElementById('new-password').value.trim();
        const confirmPassword = document.getElementById('confirm-password').value.trim();

        // Validate password length
        if (newPassword.length < 8 || confirmPassword.length < 8) {
            alert('Password must be at least 8 characters long.');
            return;
        }

        if (newPassword !== confirmPassword) {
            alert('Passwords do not match. Please try again.');
            return;
        }

        // Get the token from the URL
        const urlParams = new URLSearchParams(window.location.search);
        const token = urlParams.get('token');

        // Prepare the request body
        const requestBody = {
            token: token,
            newPassword: newPassword
        };

        try {
            // Send POST request to the reset password API
            const response = await fetch('http://localhost:6060/auth/reset-password', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(requestBody)
            });

            if (response.ok) {
                showMessagePopup('Success', 'Password has been reset successfully.');
                setTimeout(() => {
                    window.location.href = '../login/login.html';
                }, 2000);
            } else {
                const errorData = await response.json();
                showMessagePopup('Error', errorData.message || 'An error occurred. Please try again later.');
            }
        } catch (error) {
            console.error('Error:', error);
            showMessagePopup('Error', 'An error occurred. Please try again later.');
        }
    });

    function showMessagePopup(title, message) {
        document.getElementById('popupTitle').textContent = title;
        document.getElementById('popupMessage').textContent = message;
        document.getElementById('messagePopup').style.display = 'block';
    }

    // Close popup when the close button is clicked
    document.querySelector('.close-btn').addEventListener('click', function() {
        document.getElementById('messagePopup').style.display = 'none';
    });
</script>
</body>
</html>
